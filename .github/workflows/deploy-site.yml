name: Deploy codway.su
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build static site (SSG)
        run: node site/build.mjs
      - name: Check pages contain real content
        run: |
          for p in index telegram-bot-na-zakaz telegram-mini-app-na-zakaz sajt-na-zakaz parser-na-zakaz ceny kontakty; do
            grep -q "<h1>" dist/$p.html && grep -q "@codwey_bot" dist/$p.html || { echo "bad $p"; exit 1; }
          done
          if grep -rlE "9607536162|960[ -]?753|753-61-62" dist; then echo "phone number must not be published"; exit 1; fi
          test -f dist/CNAME && test -f dist/.nojekyll && ls dist/google*.html dist/yandex_*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
