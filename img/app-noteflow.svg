<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1407"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#b)"/>
  <!-- stack of notes -->
  <g transform="translate(48 50)">
    <rect width="120" height="36" rx="6" fill="#1f1f1f" stroke="url(#g)" stroke-width="3" transform="rotate(-3 60 18)"/>
    <rect width="120" height="36" rx="6" fill="#161616" stroke="url(#g)" stroke-width="3" transform="translate(20 30) rotate(2 60 18)"/>
    <rect width="120" height="100" rx="8" fill="#0a0a0a" stroke="url(#g)" stroke-width="3" transform="translate(8 60)"/>
    <line x1="22" y1="78" x2="110" y2="78" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="94" x2="100" y2="94" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <line x1="22" y1="110" x2="92" y2="110" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <line x1="22" y1="126" x2="106" y2="126" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <line x1="22" y1="142" x2="80" y2="142" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>
  <!-- pen -->
  <g transform="translate(160 50) rotate(35)">
    <rect width="64" height="10" rx="3" fill="url(#g)"/>
    <polygon points="64,0 64,10 76,5" fill="url(#g)"/>
  </g>
  <text x="128" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#facc15" letter-spacing="3">NOTEFLOW</text>
</svg>
