<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата заказа — CodWay</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23050505'/%3E%3Cpath d='M44 10L22 54' stroke='%23ffffff' stroke-width='6' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#050505; --surface:#0f0f0f; --line:rgba(255,255,255,.1); --line-strong:rgba(255,255,255,.24);
      --white:#fff; --text:#f5f5f5; --muted:#a3a3a3; --faint:#6b6b6b; --font:'Inter',sans-serif; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
    .card { width:min(460px,100%); background:linear-gradient(180deg,#121212,#090909);
      border:1px solid var(--line-strong); border-radius:14px; padding:38px 34px 30px; position:relative; }
    .card::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
      background:linear-gradient(90deg,transparent,var(--white),transparent); }
    .brand { font-size:18px; font-weight:900; letter-spacing:-.03em; }
    .eyebrow { font-size:11px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px; }
    h1 { font-size:24px; font-weight:900; text-transform:uppercase; letter-spacing:-.02em; margin-bottom:22px; }
    .rows { border:1px solid var(--line); border-radius:8px; padding:2px 16px; margin-bottom:22px; background:rgba(255,255,255,.02); }
    .row { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:12px 0; font-size:13.5px; color:var(--muted); }
    .row + .row { border-top:1px solid var(--line); }
    .row b { color:var(--text); }
    .row.total b { font-size:22px; font-weight:900; color:var(--white); letter-spacing:-.02em; }
    .btn { width:100%; padding:15px; border:none; border-radius:8px; background:var(--white); color:var(--bg);
      font-family:var(--font); font-size:13.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
      transition:transform .2s, background-color .2s; }
    .btn:hover { transform:translateY(-1px); background:#e9e9e9; }
    .btn:disabled { opacity:.5; cursor:default; transform:none; }
    .note { margin-top:14px; font-size:11.5px; color:var(--faint); text-align:center; line-height:1.6; }
    .msg { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:12.5px; line-height:1.5; text-align:center; }
    .msg.ok { border:1px solid rgba(150,210,170,.4); background:rgba(150,210,170,.08); color:#a5dcb2; }
    .msg.err { border:1px solid rgba(255,107,107,.4); background:rgba(255,107,107,.08); color:#ff9b9b; }
    a { color:var(--white); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">CODWAY</div>
    <p class="eyebrow">Оплата заказа</p>
    <h1 id="title">Заказ</h1>

    <div class="rows">
      <div class="row"><span>Номер заказа</span><b id="orderId">—</b></div>
      <div class="row"><span>Назначение</span><b id="desc">Разработка</b></div>
      <div class="row total"><span>К оплате</span><b id="amount">—</b></div>
    </div>

    <button class="btn" id="payBtn">Оплатить</button>
    <p class="note">Оплата через защищённую форму банка-эквайера.<br>После оплаты вернётесь на эту страницу.</p>
    <div id="msg"></div>
  </div>

  <script>
  (function () {
    var API = 'https://api.codway.su/api/payment/create';
    var q = new URLSearchParams(location.search);
    var orderId = q.get('order') || q.get('order_id') || '';
    var amount = parseFloat(q.get('amount') || '0');
    var desc = q.get('desc') || 'Разработка CodWay';
    var status = q.get('status') || '';

    document.getElementById('orderId').textContent = orderId || '—';
    document.getElementById('desc').textContent = desc;
    document.getElementById('amount').textContent = amount > 0
      ? amount.toLocaleString('ru-RU') + ' ₽' : '—';
    if (orderId) document.getElementById('title').textContent = 'Заказ №' + orderId;

    var msg = document.getElementById('msg');
    var btn = document.getElementById('payBtn');

    function show(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }

    if (status === 'success') { show('ok', 'Оплата прошла. Мы уже получили подтверждение и свяжемся с вами.'); btn.disabled = true; }
    else if (status === 'fail') { show('err', 'Платёж не завершён. Можно попробовать ещё раз.'); }

    if (!amount || !orderId) { btn.disabled = true; if (!status) show('err', 'Ссылка на оплату неполная. Запросите её у менеджера.'); }

    btn.addEventListener('click', function () {
      btn.disabled = true; show('', 'Готовим платёж…');
      fetch(API, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId, amount: amount, description: desc })
      })
        .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.d && res.d.ok && res.d.url) { location.href = res.d.url; return; }
          if (res.s === 503) show('err', 'Онлайн-оплата ещё не подключена. Менеджер пришлёт реквизиты вручную.');
          else show('err', 'Не удалось создать платёж. Напишите нам в Telegram @codwey.');
          btn.disabled = false;
        })
        .catch(function () { show('err', 'Нет связи с сервером. Попробуйте позже.'); btn.disabled = false; });
    });
  })();
  </script>
</body>
</html>
